modLoader = "javafml"
loaderVersion = "*"
license = "LGPLv3"

[[mods]]
modId = "firis"

version = "${version}"
displayName = "Firis"

logoFile="firis.png" #optional

authors="coderbot, IMS212, Justsnoopy30, FoundationGames"

description = '''
A modern shaders mod for Minecraft intended to be compatible with existing OptiFine shader packs.
'''

[[mods]]
modId = "oculus"
version = "${version}"
displayName = "Firis (Oculus Stub)"
description = '''
stub for oculus
'''

[[dependencies.firis]]
modId="fodium"
mandatory=true
versionRange="[0.6.0,0.6.1)"
ordering="NONE"
side="BOTH"


[mods."fodium:options"]
"mixin.features.render.world.sky"=false
"mixin.features.render.gui.font"=false
